<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">
    Startups Blogs – Authentication &amp; Security Architecture
  </text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-size="13">
    Kiến trúc Xác thực Đa tầng với Amazon Cognito, NestJS Backend &amp; HttpOnly Cookies
  </text>

  <!-- Node 1: React Frontend -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="240" height="360" rx="10" fill="url(#card-dark)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="45" rx="10" fill="#0284c7"/>
    <rect x="0" y="35" width="240" height="10" fill="#0284c7"/>
    <text x="120" y="28" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">React 19 Frontend</text>

    <!-- Sub items -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="210" height="50" rx="6" fill="#334155"/>
      <text x="105" y="22" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Form Đăng nhập / Đăng ký</text>
      <text x="105" y="38" text-anchor="middle" fill="#94a3b8" font-size="10">HTTPS REST Requests</text>

      <rect x="0" y="65" width="210" height="50" rx="6" fill="#334155"/>
      <text x="105" y="87" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Zustand authStore</text>
      <text x="105" y="103" text-anchor="middle" fill="#94a3b8" font-size="10">Lưu Profile &amp; User State</text>

      <rect x="0" y="130" width="210" height="65" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="105" y="152" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">HttpOnly Cookies</text>
      <text x="105" y="168" text-anchor="middle" fill="#cbd5e1" font-size="10">Tự động gắn kèm Cookie</text>
      <text x="105" y="182" text-anchor="middle" fill="#94a3b8" font-size="9">Bảo vệ chống đánh cắp XSS</text>
    </g>
  </g>

  <!-- Arrow Frontend -> NestJS -->
  <line x1="280" y1="210" x2="350" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="200" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">HTTPS / REST</text>

  <!-- Node 2: NestJS Backend -->
  <g transform="translate(360, 95)" filter="url(#shadow)">
    <rect width="260" height="360" rx="10" fill="url(#card-dark)" stroke="#f97316" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="45" rx="10" fill="#ea580c"/>
    <rect x="0" y="35" width="260" height="10" fill="#ea580c"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">NestJS Security Backend</text>

    <!-- Sub items -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="230" height="55" rx="6" fill="#334155"/>
      <text x="115" y="22" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">SecretHash Calculation</text>
      <text x="115" y="38" text-anchor="middle" fill="#fdba74" font-size="10">HMAC-SHA256(Secret, User+Client)</text>

      <rect x="0" y="70" width="230" height="55" rx="6" fill="#334155"/>
      <text x="115" y="92" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">aws-jwt-verify Guard</text>
      <text x="115" y="108" text-anchor="middle" fill="#fdba74" font-size="10">Thẩm định chữ ký RSA từ JWKS</text>

      <rect x="0" y="140" width="230" height="55" rx="6" fill="#334155"/>
      <text x="115" y="162" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">NestJS RolesGuard</text>
      <text x="115" y="178" text-anchor="middle" fill="#fdba74" font-size="10">Phân quyền RBAC &amp; Cognito Groups</text>

      <rect x="0" y="210" width="230" height="55" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
      <text x="115" y="232" text-anchor="middle" fill="#f97316" font-size="11" font-weight="bold">COGNITO_CLIENT_SECRET</text>
      <text x="115" y="248" text-anchor="middle" fill="#94a3b8" font-size="10">Bảo mật 100% tại Server Env</text>
    </g>
  </g>

  <!-- Arrow NestJS -> Cognito -->
  <line x1="620" y1="210" x2="690" y2="210" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="200" text-anchor="middle" fill="#f97316" font-size="10" font-weight="bold">AWS SDK</text>

  <!-- Node 3: Amazon Cognito & PostgreSQL -->
  <g transform="translate(700, 95)" filter="url(#shadow)">
    <rect width="220" height="360" rx="10" fill="url(#card-dark)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="45" rx="10" fill="#7c3aed"/>
    <rect x="0" y="35" width="220" height="10" fill="#7c3aed"/>
    <text x="110" y="28" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Cloud Services &amp; DB</text>

    <!-- Sub items -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="190" height="85" rx="6" fill="#334155" stroke="#8b5cf6" stroke-width="1"/>
      <text x="95" y="22" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Amazon Cognito Pool</text>
      <text x="95" y="40" text-anchor="middle" fill="#c084fc" font-size="10">Quản lý Tài khoản &amp; Credentials</text>
      <text x="95" y="56" text-anchor="middle" fill="#c084fc" font-size="10">Phát hành JWT &amp; JWKS Keys</text>
      <text x="95" y="72" text-anchor="middle" fill="#c084fc" font-size="10">Group ADMIN Integration</text>

      <rect x="0" y="105" width="190" height="85" rx="6" fill="#334155" stroke="#10b981" stroke-width="1"/>
      <text x="95" y="127" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Amazon RDS PostgreSQL</text>
      <text x="95" y="145" text-anchor="middle" fill="#6ee7b7" font-size="10">Prisma ORM Persistence</text>
      <text x="95" y="161" text-anchor="middle" fill="#6ee7b7" font-size="10">Mapping identity: cognitoSub</text>
      <text x="95" y="177" text-anchor="middle" fill="#6ee7b7" font-size="10">Coordinated Consistency</text>
    </g>
  </g>

  <!-- Bottom Summary Banner -->
  <rect x="40" y="470" width="880" height="35" rx="6" fill="#1e293b"/>
  <text x="480" y="492" text-anchor="middle" fill="#94a3b8" font-size="11">
    Bảo mật 3 lớp: SecretHash bảo vệ Client Secret, HttpOnly Cookies chống XSS, aws-jwt-verify thẩm định RSA chữ ký số JWT từ JWKS us-east-1.
  </text>
</svg>
